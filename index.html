    <meta name="description" content="avrgtech makes cinematic tech and desk-setup videos: sponsored posts, UGC and local business video for brands that care how their product looks." />
    <script>
      // Dark by default; apply a saved choice before first paint so the page never flashes.
      ;(function () {
        var t = "dark"
        try {
          if (localStorage.getItem("avrg-theme") === "light") t = "light"
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t)
      })()
    </script>
